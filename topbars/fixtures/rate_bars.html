    const liked = new Set();
    
    function render() {
      const container = document.getElementById('bars');
      container.innerHTML = bars.map((bar, i) => `
        <div class="bar" data-idx="${i}">
          <span class="votes">${bar.v}</span>
          ${bar.acc ? '<span class="acc">✓</span>' : '<span style="width:16px"></span>'}
          <span class="lyric">${escapeHtml(bar.l)}</span>
          <button class="like-btn ${liked.has(i) ? 'liked' : ''}" onclick="toggle(${i})">
            ${liked.has(i) ? '★' : '☆'}
          </button>
        </div>
      `).join('');
      
      document.getElementById('totalCount').textContent = bars.length;
      document.getElementById('likedCount').textContent = liked.size;
      updateOutput();
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function toggle(idx) {
      if (liked.has(idx)) {
        liked.delete(idx);
      } else {
        liked.add(idx);
      }
      render();
    }
    
    function updateOutput() {
      const likedBars = [...liked].sort((a,b) => a-b).map(i => bars[i]);
      if (likedBars.length === 0) {
        document.getElementById('output').textContent = 'Click some bars above...';
        return;
      }
      
      const output = likedBars.map(b => JSON.stringify({
        v: b.v,
        acc: b.acc,
        iq: b.iq,
        l: b.l
      })).join('\n');
      
      document.getElementById('output').textContent = output;
    }
    
    render();
  </script>
