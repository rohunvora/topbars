    "lyric": "Yeah, I’m done skippin’ classes with you for the drugs (ok is the hardest, I swear to God)",
    "score": 50,
    "note_len": 365,
    "votes": 11,
    "acc": false
  }
]
;

let minScore = 0;

function clean(s) {
  return s
    .toLowerCase()
    .replace(/\n/g, ' / ')
    .replace(/\s*\([^)]*\)\s*/g, ' ')
    .replace(/[,."'!?]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function render() {
  const filtered = bars.filter(b => b.score >= minScore);
  document.getElementById('count').textContent = `showing ${filtered.length} bars`;
  
  document.getElementById('bars').innerHTML = filtered.map(bar => {
    const tier = bar.score >= 150 ? 'top' : bar.score >= 120 ? 'great' : bar.score >= 100 ? 'good' : '';
    const scoreClass = bar.score >= 120 ? 'high' : '';
    return `
      <div class="bar ${tier}">
        <div class="lyric">${clean(bar.lyric)}</div>
        <div class="meta">
          <span class="score ${scoreClass}">${bar.score} pts</span>
          ${bar.votes}v · ${bar.note_len}ch note
        </div>
      </div>
    `;
  }).join('');
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    minScore = parseInt(btn.dataset.min);
    render();
  };
});

render();
  </script>
</body>
</html>
