const liked = new Set();

function render() {
  const container = document.getElementById('bars');
  container.innerHTML = bars.map((bar, i) => `
    <div class="bar ${liked.has(i) ? 'liked' : ''}" id="bar-${i}">
      <button class="like-btn ${liked.has(i) ? 'active' : ''}" onclick="toggle(${i})">♥</button>
      <div class="lyric">
        <div>"${escapeHtml(bar.l.replace(/\n/g, ' / '))}"</div>
        <div class="meta">${bar.v}v ${bar.acc ? '<span class="acc">✓acc</span>' : ''} | iq:${bar.iq}</div>
      </div>
    </div>
  `).join('');
}

function toggle(i) {
  if (liked.has(i)) liked.delete(i);
  else liked.add(i);
  updateOutput();
  render();
}

function updateOutput() {
  const likedBars = [...liked].map(i => bars[i]);
  document.getElementById('output').textContent = JSON.stringify(likedBars, null, 2);
  document.getElementById('likeCount').textContent = liked.size;
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output').textContent);
  document.getElementById('copyBtn').textContent = 'Copied!';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy JSON', 2000);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
  </script>
